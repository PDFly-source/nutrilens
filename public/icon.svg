<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#159A6A" />
      <stop offset="100%" stop-color="#08734E" />
    </linearGradient>
    <filter id="nlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#08734E" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="#F7F7F2" />
  
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#DDF5EA" stroke-width="24" />
  
  <!-- Reticle Corners -->
  <path d="M 140 190 L 140 140 L 190 140" fill="none" stroke="#159A6A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 372 190 L 372 140 L 322 140" fill="none" stroke="#159A6A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 140 322 L 140 372 L 190 372" fill="none" stroke="#159A6A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 372 322 L 372 372 L 322 372" fill="none" stroke="#159A6A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Leaf / Lens Emblem -->
  <g filter="url(#nlShadow)">
    <circle cx="256" cy="256" r="96" fill="url(#nlGrad)" />
    <!-- Leaf / Aperture Geometry -->
    <path d="M 216 296 C 216 230, 256 216, 296 216 C 296 282, 256 296, 216 296 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="272" cy="240" r="14" fill="#B9D94C" />
  </g>
  
  <!-- Scan Horizontal Beam Dot -->
  <line x1="170" y1="256" x2="342" y2="256" stroke="#B9D94C" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>
